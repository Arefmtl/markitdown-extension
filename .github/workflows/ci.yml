name: CI/CD — MarkItDown Extension

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  validate:
    name: 🔍 Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          node -e "
            const m = require('./manifest.json');
            console.log('✅ Name:', m.name);
            console.log('✅ Version:', m.version);
            console.log('✅ Manifest V' + m.manifest_version);
            if (m.manifest_version !== 3) throw new Error('Must be MV3');
            if (!m.content_scripts) throw new Error('No content_scripts');
            if (!m.background) throw new Error('No background');
            console.log('✅ Content scripts:', m.content_scripts[0].js.length, 'files');
          "

      - name: Check required files
        run: |
          for f in manifest.json content.js content.css popup.html popup.js background.js converter.html converter.js; do
            if [ ! -f "$f" ]; then echo "❌ Missing: $f"; exit 1; fi
            echo "✅ $f"
          done

      - name: Check libraries
        run: |
          for f in lib/pdf.min.js lib/pdf.worker.min.js lib/mammoth.browser.min.js lib/xlsx.full.min.js lib/tesseract.min.js; do
            if [ ! -f "$f" ]; then echo "❌ Missing: $f"; exit 1; fi
            echo "✅ $f ($(wc -c < "$f") bytes)"
          done

      - name: Validate JS syntax
        run: |
          for f in content.js popup.js background.js converter.js; do
            node --check "$f" 2>&1 && echo "✅ $f" || echo "⚠️ $f"
          done

  package:
    name: 📦 Package
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: v
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package extension
        run: |
          zip -r markitdown-${{ steps.v.outputs.tag }}.zip \
            manifest.json content.js content.css popup.html popup.js background.js \
            converter.html converter.js lib/ icons/
          ls -lh markitdown-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: markitdown-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
