name: CI/CD — MarkItDown Extension

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  validate:
    name: 🔍 Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          node -e "
            const m = require('./manifest.json');
            console.log('✅ Name:', m.name);
            console.log('✅ Version:', m.version);
            console.log('✅ Manifest V' + m.manifest_version);
            if (m.manifest_version !== 3) throw new Error('Must be MV3');
            if (!m.content_scripts) throw new Error('No content_scripts');
            if (!m.background) throw new Error('No background');
            console.log('✅ Content scripts:', m.content_scripts[0].js.length, 'files');
            console.log('✅ Matches:', m.content_scripts[0].matches);
          "

      - name: Check required files
        run: |
          for f in manifest.json content.js content.css popup.html popup.js background.js converter.html; do
            if [ ! -f "$f" ]; then echo "❌ Missing: $f"; exit 1; fi
            echo "✅ $f"
          done

      - name: Check libraries
        run: |
          for f in lib/pdf.min.js lib/pdf.worker.min.js lib/mammoth.browser.min.js lib/xlsx.full.min.js lib/tesseract.min.js; do
            if [ ! -f "$f" ]; then echo "❌ Missing: $f"; exit 1; fi
            sz=$(wc -c < "$f")
            echo "✅ $f ($sz bytes)"
          done

      - name: Validate JS syntax
        run: |
          for f in content.js popup.js background.js; do
            node --check "$f" 2>&1 && echo "✅ $f syntax OK" || echo "⚠️ $f syntax issue"
          done

  package:
    name: 📦 Package
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package extension
        run: |
          # Create clean zip (no git files)
          zip -r markitdown-extension-${{ steps.version.outputs.tag }}.zip \
            manifest.json content.js content.css popup.html popup.js background.js converter.html \
            lib/ icons/ \
            -x "*.DS_Store" "*.git*"
          echo "📦 Packaged:"
          ls -lh markitdown-extension-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: markitdown-extension-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: 🌐 Deploy Demo Page
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Create demo page
        run: |
          mkdir -p _site
          cp converter.html _site/index.html
          cp -r lib/ _site/lib/
          cp -r icons/ _site/icons/
          cat > _site/_headers <<'EOF'
          Content-Security-Policy: default-src 'self' https://cdnjs.cloudflare.com https://cdn.sheetjs.com https://cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'
          EOF

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
