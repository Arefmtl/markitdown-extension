<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      width:320px;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#0d1117;
      color:#e0e0e0;
    }

    /* === HEADER === */
    .header{
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      padding:20px 16px;
      text-align:center;
    }
    .header h1{
      font-size:18px;
      color:#fff;
      font-weight:700;
      margin-bottom:4px;
    }
    .header p{
      font-size:11px;
      color:rgba(255,255,255,.8);
    }

    /* === STATUS === */
    .status{
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px 16px;
      margin:12px;
      background:#161b22;
      border-radius:10px;
      border:1px solid #30363d;
    }
    .status-dot{
      width:10px;height:10px;
      border-radius:50%;
      flex-shrink:0;
    }
    .status-dot.active{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.4)}
    .status-dot.inactive{background:#ef4444}
    .status-text{
      font-size:12px;
      color:#8b949e;
    }

    /* === QUICK ACTIONS === */
    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      padding:0 12px;
      margin-bottom:12px;
    }
    .action{
      background:#161b22;
      border:1px solid #30363d;
      border-radius:10px;
      padding:14px 10px;
      text-align:center;
      cursor:pointer;
      transition:all .15s;
    }
    .action:hover{
      border-color:#667eea;
      background:rgba(102,126,234,.08);
    }
    .action:active{transform:scale(.96)}
    .action-icon{font-size:24px;margin-bottom:6px}
    .action-label{font-size:11px;font-weight:500;color:#c9d1d9}

    /* === CONVERT BUTTON === */
    .convert-btn{
      display:block;
      margin:0 12px 12px;
      padding:14px;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      border:none;
      border-radius:10px;
      color:#fff;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      transition:all .15s;
      text-align:center;
    }
    .convert-btn:hover{opacity:.9}
    .convert-btn:active{transform:scale(.98)}

    /* === SUPPORTED FORMATS === */
    .formats{
      padding:0 12px;
      margin-bottom:12px;
    }
    .formats-title{
      font-size:10px;
      color:#8b949e;
      text-transform:uppercase;
      letter-spacing:.05em;
      margin-bottom:8px;
    }
    .format-list{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }
    .format{
      background:#161b22;
      border:1px solid #30363d;
      border-radius:6px;
      padding:4px 8px;
      font-size:10px;
      color:#8b949e;
    }
    .format.highlight{
      border-color:#667eea;
      color:#667eea;
    }

    /* === FOOTER === */
    .footer{
      padding:10px 12px;
      background:#161b22;
      border-top:1px solid #30363d;
      text-align:center;
      font-size:10px;
      color:#8b949e;
    }
    .footer a{
      color:#667eea;
      text-decoration:none;
    }
    .footer a:hover{text-decoration:underline}

    /* === ANIMATIONS === */
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .action{animation:fadeIn .2s ease}
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>📄 MarkItDown</h1>
    <p>File → Markdown — save tokens 💰</p>
  </div>

  <!-- Status -->
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking...</span>
  </div>

  <!-- Quick Actions -->
  <div class="actions">
    <div class="action" id="openConverter">
      <div class="action-icon">🔢</div>
      <div class="action-label">Converter</div>
    </div>
    <div class="action" id="openDocs">
      <div class="action-icon">📖</div>
      <div class="action-label">Documentation</div>
    </div>
  </div>

  <!-- Convert Button -->
  <button class="convert-btn" id="convertBtn">🚀 Open Converter</button>

  <!-- Supported Formats -->
  <div class="formats">
    <div class="formats-title">Supported Formats</div>
    <div class="format-list">
      <span class="format">PDF</span>
      <span class="format">DOCX</span>
      <span class="format">XLSX</span>
      <span class="format">PPTX</span>
      <span class="format">CSV</span>
      <span class="format">TXT</span>
      <span class="format highlight">OCR</span>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    v1.3.2 • <a href="https://github.com/Arefmtl/markitdown-extension" target="_blank">GitHub</a>
  </div>

  <script>
    // Check current tab
    chrome.tabs.query({active:true,currentWindow:true}, ([tab]) => {
      try {
        const host = new URL(tab.url).hostname;
        const ai = ['chatgpt.com','chat.openai.com','claude.ai','gemini.google.com','copilot.microsoft.com','you.com','poe.com','huggingface.co'];
        const dot = document.getElementById('statusDot');
        const txt = document.getElementById('statusText');
        if (ai.some(s => host.includes(s))) {
          dot.classList.add('active');
          txt.textContent = 'Active on ' + host;
        } else {
          dot.classList.add('inactive');
          txt.textContent = 'Open converter below ↓';
        }
      } catch(e) {
        document.getElementById('statusText').textContent = 'Ready';
        document.getElementById('statusDot').classList.add('active');
      }
    });

    // Open converter
    document.getElementById('openConverter').onclick = () => {
      chrome.tabs.create({ url: 'converter.html' });
      window.close();
    };
    document.getElementById('convertBtn').onclick = () => {
      chrome.tabs.create({ url: 'converter.html' });
      window.close();
    };

    // Open docs
    document.getElementById('openDocs').onclick = () => {
      chrome.tabs.create({ url: 'https://github.com/Arefmtl/markitdown-extension' });
      window.close();
    };
  </script>
</body>
</html>
