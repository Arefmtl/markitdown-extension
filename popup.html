<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{width:300px;font-family:-apple-system,sans-serif;background:#1a1a2e;color:#e0e0e0}
    .h{background:linear-gradient(135deg,#667eea,#764ba2);padding:14px;text-align:center}
    .h h1{font-size:16px;color:#fff}
    .h p{font-size:11px;color:rgba(255,255,255,.8);margin-top:3px}
    .c{padding:14px}
    .st{display:flex;align-items:center;gap:8px;padding:10px;background:#0d1117;border-radius:8px;margin-bottom:12px;font-size:13px}
    .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;flex-shrink:0}
    .dot.off{background:#ef4444}
    .go{display:block;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:10px;text-align:center;color:#fff;text-decoration:none;font-weight:700;font-size:15px;cursor:pointer;border:none;width:100%;margin-top:8px}
    .go:hover{opacity:.9}
    .note{margin-top:12px;padding:10px;background:#0d1117;border-radius:8px;font-size:11px;color:#888;text-align:center}
  </style>
</head>
<body>
  <div class="h">
    <h1>📄 MarkItDown</h1>
    <p>File → Markdown converter</p>
  </div>
  <div class="c">
    <div class="st">
      <div class="dot" id="dot"></div>
      <span id="stxt">Checking...</span>
    </div>
    <button class="go" id="openConverter">🔢 Open Converter</button>
    <div class="note">
      Drop any file → get .md → paste into AI chat<br>
      Saves ~90% tokens 💰
    </div>
  </div>
  <script>
    // Check current tab
    chrome.tabs.query({active:true,currentWindow:true}, ([tab]) => {
      try {
        const host = new URL(tab.url).hostname;
        const ai = ['chatgpt.com','chat.openai.com','claude.ai','gemini.google.com','copilot.microsoft.com','you.com','poe.com','huggingface.co'];
        const dot = document.getElementById('dot');
        const txt = document.getElementById('stxt');
        if (ai.some(s => host.includes(s))) {
          dot.classList.remove('off');
          txt.textContent = 'Active on ' + host;
        } else {
          dot.classList.add('off');
          txt.textContent = 'Open converter below ↓';
        }
      } catch(e) {
        document.getElementById('stxt').textContent = 'Ready';
      }
    });

    // Open converter in new tab
    document.getElementById('openConverter').onclick = () => {
      chrome.tabs.create({ url: 'converter.html' });
      window.close();
    };
  </script>
</body>
</html>
