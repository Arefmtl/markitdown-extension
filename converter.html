<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📄 MarkItDown — File to Markdown Converter</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
    h1{font-size:28px;margin:20px 0 5px}
    h1 span{background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sub{color:#888;margin-bottom:30px}
    .dropzone{width:100%;max-width:700px;border:2px dashed #333;border-radius:16px;padding:50px;text-align:center;cursor:pointer;transition:all .2s}
    .dropzone:hover,.dropzone.over{border-color:#667eea;background:rgba(102,126,234,.08)}
    .dropzone .ic{font-size:50px;margin-bottom:10px}
    .dropzone p{color:#aaa;font-size:16px}
    .dropzone small{color:#555}
    #out{width:100%;max-width:700px;margin-top:20px;display:none}
    .info{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
    .card{background:#161b22;padding:12px 18px;border-radius:10px;flex:1;min-width:140px}
    .card b{color:#667eea}
    textarea{width:100%;height:400px;background:#161b22;border:1px solid #333;border-radius:10px;color:#e0e0e0;padding:14px;font-size:13px;font-family:'JetBrains Mono',monospace;resize:vertical}
    textarea:focus{outline:none;border-color:#667eea}
    .btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
    .btn{padding:12px 24px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
    .btn:hover{opacity:.85}
    .b1{background:#333;color:#e0e0e0}
    .b2{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
    .b3{background:#238636;color:#fff}
    .spin{width:36px;height:36px;border:3px solid #333;border-top-color:#667eea;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
    @keyframes sp{to{transform:rotate(360deg)}}
    #file{display:none}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
    .toast.show{opacity:1}
    .ocr-badge{display:inline-block;background:#f59e0b;color:#000;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-left:8px}
    .progress{width:100%;height:6px;background:#333;border-radius:3px;margin-top:10px;overflow:hidden;display:none}
    .progress .bar{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);width:0%;transition:width .3s}
    .progress-text{font-size:12px;color:#888;margin-top:4px;text-align:center}
  </style>
</head>
<body>
  <h1>📄 <span>MarkItDown</span></h1>
  <p class="sub">Convert any file to Markdown — with <strong>OCR</strong> for images & scanned PDFs</p>

  <div class="dropzone" id="dz">
    <div class="ic">📁</div>
    <p>Drop a file here or click to select</p>
    <small>PDF • DOCX • XLSX • PPTX • CSV • TXT • MD • JSON • <strong>Images (OCR)</strong></small>
    <input type="file" id="file" accept=".pdf,.docx,.xlsx,.xls,.pptx,.txt,.md,.json,.xml,.html,.css,.js,.py,.ts,.csv,.java,.c,.cpp,.go,.rs,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tiff">
  </div>

  <div id="out">
    <div class="info">
      <div class="card">📄 <b id="fn">-</b></div>
      <div class="card">📊 <b id="tk">-</b> tokens</div>
      <div class="card">📦 <b id="ch">-</b> chars</div>
    </div>
    <textarea id="md" readonly></textarea>
    <div class="btns">
      <button class="btn b1" id="cpBtn">📋 Copy</button>
      <button class="btn b3" id="dlBtn">💾 Download .md</button>
      <button class="btn b2" id="againBtn">🔄 Convert Another</button>
    </div>
  </div>

  <div class="progress" id="prog">
    <div class="bar" id="bar"></div>
    <div class="progress-text" id="progTxt">Loading OCR engine...</div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- CDN Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    // PDF.js worker
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const dz = document.getElementById('dz');
    const fi = document.getElementById('file');
    const out = document.getElementById('out');
    const toast = document.getElementById('toast');
    const prog = document.getElementById('prog');
    const bar = document.getElementById('bar');
    const progTxt = document.getElementById('progTxt');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function showProgress(text, pct) {
      prog.style.display = 'block';
      progTxt.textContent = text;
      bar.style.width = pct + '%';
    }

    function hideProgress() {
      prog.style.display = 'none';
      bar.style.width = '0%';
    }

    dz.onclick = () => fi.click();
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = () => dz.classList.remove('over');
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); go(e.dataTransfer.files[0]); };
    fi.onchange = e => go(e.target.files[0]);

    document.getElementById('againBtn').onclick = () => {
      out.style.display = 'none';
      dz.style.display = 'block';
      fi.value = '';
    };

    document.getElementById('cpBtn').onclick = () => {
      navigator.clipboard.writeText(document.getElementById('md').value);
      showToast('✅ Copied to clipboard!');
    };

    document.getElementById('dlBtn').onclick = () => {
      const text = document.getElementById('md').value;
      const name = document.getElementById('fn').textContent.replace(/\.[^.]+$/, '') + '.md';
      const blob = new Blob([text], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      showToast('💾 Downloaded ' + name);
    };

    // === OCR via Tesseract.js ===
    async function ocrImage(imageData) {
      showProgress('OCR: Loading engine...', 10);
      const worker = await Tesseract.createWorker('eng', 1, {
        logger: m => {
          if (m.status === 'recognizing text') {
            const pct = Math.round(m.progress * 100);
            showProgress(`OCR: Recognizing... ${pct}%`, 10 + pct * 0.8);
          }
        }
      });
      showProgress('OCR: Processing...', 20);
      const { data: { text } } = await worker.recognize(imageData);
      await worker.terminate();
      hideProgress();
      return text;
    }

    // === PDF with OCR fallback ===
    async function pdfToMarkdown(buffer) {
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      let md = '';
      let hasText = false;

      for (let i = 1; i <= pdf.numPages; i++) {
        showProgress(`PDF: Page ${i}/${pdf.numPages}...`, (i / pdf.numPages) * 80);
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const text = content.items.map(item => item.str).join(' ').trim();

        if (text.length > 10) {
          hasText = true;
          md += `\n---\n**Page ${i}**\n\n${text}\n`;
        } else {
          // Scanned page — OCR it
          showProgress(`OCR: Scanning page ${i}/${pdf.numPages}...`, (i / pdf.numPages) * 80);
          const viewport = page.getViewport({ scale: 2.0 }); // higher res for OCR
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;
          const imgData = canvas.toDataURL('image/png');
          const ocrText = await ocrImage(imgData);
          if (ocrText.trim()) {
            md += `\n---\n**Page ${i}** (OCR)\n\n${ocrText.trim()}\n`;
          }
        }
      }
      return md.trim() || (hasText ? '[PDF: no text found]' : '[PDF: scanned, OCR failed]');
    }

    // === Image OCR ===
    async function imageToMarkdown(file) {
      showProgress('OCR: Loading image...', 10);
      const url = URL.createObjectURL(file);
      const text = await ocrImage(url);
      URL.revokeObjectURL(url);
      return text.trim() || '[Image: no text detected]';
    }

    // === Main converter ===
    async function go(file) {
      if (!file) return;
      dz.innerHTML = '<div class="spin"></div><p>Converting...</p>';
      const buf = await file.arrayBuffer();
      const ext = file.name.split('.').pop().toLowerCase();
      const imageExts = ['png','jpg','jpeg','webp','gif','bmp','tiff'];
      let md = '';
      let usedOcr = false;

      try {
        if (ext === 'pdf') {
          md = await pdfToMarkdown(buffer);
          // Check if OCR was used (has "OCR" in page headers)
          usedOcr = md.includes('(OCR)');
        } else if (imageExts.includes(ext)) {
          md = await imageToMarkdown(file);
          usedOcr = true;
        } else if (ext === 'docx') {
          md = (await mammoth.convertToMarkdown({ arrayBuffer: buf })).value;
        } else if (ext === 'xlsx' || ext === 'xls') {
          const wb = XLSX.read(buf, { type: 'array' });
          wb.SheetNames.forEach(name => {
            const data = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1 });
            if (!data.length) return;
            md += `\n### 📊 ${name}\n\n| ${data[0].join(' | ')} |\n| ${data[0].map(()=>'---').join(' | ')} |\n`;
            data.slice(1).forEach(r => md += `| ${r.map(c=>c??'').join(' | ')} |\n`);
          });
        } else if (ext === 'pptx') {
          const txt = new TextDecoder().decode(buf);
          const m = txt.match(/<a:t[^>]*>([^<]*)<\/a:t>/g) || [];
          let n = 1;
          m.forEach((x, i) => {
            const t = x.replace(/<[^>]+>/g,'').trim();
            if (t) { if (i % 8 === 0 && i) md += `\n---\n**Slide ${++n}**\n\n`; md += t + '\n'; }
          });
          if (!md) md = '[PPTX: limited extraction]';
        } else if (ext === 'csv') {
          const lines = new TextDecoder().decode(buf).split('\n').filter(l=>l.trim());
          const p = l => l.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
          md = `| ${p(lines[0]).join(' | ')} |\n| ${p(lines[0]).map(()=>'---').join(' | ')} |\n`;
          lines.slice(1).forEach(l => md += `| ${p(l).join(' | ')} |\n`);
        } else {
          md = new TextDecoder().decode(buf);
        }
      } catch(e) { md = `Error: ${e.message}`; }

      hideProgress();

      // Show result
      const tokens = Math.ceil(md.length / 4);
      document.getElementById('fn').textContent = file.name;
      document.getElementById('tk').textContent = tokens.toLocaleString();
      document.getElementById('ch').textContent = md.length.toLocaleString();
      document.getElementById('md').value = md;
      out.style.display = 'block';
      dz.style.display = 'none';

      // Auto-copy
      try { await navigator.clipboard.writeText(md); showToast(`✅ Done! ${usedOcr ? '🔍 OCR used — ' : ''}Copied to clipboard`); }
      catch(e) { showToast('✅ Converted! Click Copy or Download'); }
    }
  </script>
</body>
</html>
